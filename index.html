<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f4f4">
    <title>Set of Colored Boxes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">A little color study</p>
            <h1>Color, in five boxes.</h1>
            <p class="description">Five shades, five simple ways to describe color in CSS.</p>
        </header>

        <div class="color-grid">
            <div class="color-box color1">
                <span class="box-number">01</span>
                <span class="box-label">Hexadecimal</span>
            </div>
            <div class="color-box color2">
                <span class="box-number">02</span>
                <span class="box-label">RGB</span>
            </div>
            <div class="color-box color3">
                <span class="box-number">03</span>
                <span class="box-label">Named color</span>
            </div>
            <div class="color-box color4">
                <span class="box-number">04</span>
                <span class="box-label">HSL</span>
            </div>
            <div class="color-box color5">
                <span class="box-number">05</span>
                <span class="box-label">A little extra</span>
            </div>
        </div>
        <footer class="caption">One palette, five ways to paint it.</footer>
    </main>
</body>
</html>
